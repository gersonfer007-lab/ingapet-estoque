<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IngáPet - Sistema de Estoque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .toast { transition: all 0.3s ease; position: fixed; bottom: 20px; right: 20px; z-index: 100; }
      .loading-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); align-items:center; justify-content:center; z-index:200; color:white; flex-direction:column; }
      .spinner { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; width: 40px; height: 40px; animate: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="loading" class="loading-overlay">
       <div class="spinner mb-4"></div>
       <div id="loading-text">Processando...</div>
    </div>
    <div id="app"></div>
    <div id="toast-container"></div>

  <script>
    let state = { user: null, page: 'dashboard', products: [], summary: null };

    async function api(url, options = {}) {
      try {
        const res = await fetch(url, options);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro no servidor');
        return data;
      } catch (err) {
        toast(err.message, 'error');
        return { success: false };
      }
    }

    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast p-4 rounded shadow-lg text-white ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
      el.innerText = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    // FUNÇÃO DE COMPRESSÃO DE IMAGEM (VERDENT FIX)
    async function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1000;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => {
              resolve(new File([blob], file.name, { type: 'image/jpeg' }));
            }, 'image/jpeg', 0.6); // 60% quality for maximum speed
          };
        };
      });
    }

    async function checkAuth() {
      const data = await api('/api/auth/check');
      if (data.loggedIn) { state.user = data.user; render(); } else { renderLogin(); }
    }

    async function login(e) {
      e.preventDefault();
      const data = await api('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: e.target.username.value, password: e.target.password.value })
      });
      if (data.success) { state.user = data.user; render(); }
    }

    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-4">
          <form onsubmit="login(event)" class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border-t-4 border-orange-500">
            <h1 class="text-3xl font-bold text-center mb-6 text-orange-600">IngáPet</h1>
            <input type="text" name="username" class="w-full p-3 border rounded mb-4" placeholder="Usuário" required>
            <input type="password" name="password" class="w-full p-3 border rounded mb-6" placeholder="Senha" required>
            <button class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold">Entrar</button>
          </form>
        </div>
      `;
    }

    function render() {
      document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex flex-col md:flex-row">
          <nav class="w-full md:w-64 bg-slate-900 text-white p-4 space-y-4">
            <div class="font-bold text-xl mb-8">🐾 IngáPet</div>
            <button onclick="navigate('dashboard')" class="w-full text-left p-2 rounded hover:bg-slate-800">📊 Painel</button>
            <button onclick="navigate('products')" class="w-full text-left p-2 rounded hover:bg-slate-800">📦 Produtos</button>
            <button onclick="api('/api/auth/logout',{method:'POST'}).then(()=>location.reload())" class="w-full text-left p-2 rounded hover:bg-red-900 text-red-400 mt-10">🚪 Sair</button>
          </nav>
          <main class="flex-grow p-4 md:p-8 overflow-auto">${renderPage()}</main>
        </div>
      `;
      loadPageData();
    }

    function navigate(p) { state.page = p; render(); }

    function renderPage() {
      if (state.page === 'dashboard') return '<h2 class="text-2xl font-bold mb-6">Painel de Controle</h2><div id="stats" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>';
      return `
        <div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">Produtos</h2><button onclick="openModal()" class="bg-orange-500 text-white px-4 py-2 rounded font-bold">➕ Novo Produto</button></div>
        <div class="bg-white rounded-xl shadow overflow-hidden"><table class="w-full text-left"><thead class="bg-gray-50 border-b"><tr><th class="p-4">Produto</th><th class="p-4 text-center">Estoque</th><th class="p-4">Preço</th><th class="p-4">Ações</th></tr></thead><tbody id="table-body"></tbody></table></div>
      `;
    }

    async function loadPageData() {
      if (state.page === 'dashboard') {
        const data = await api('/api/stock/summary');
        if (data.summary) {
           document.getElementById('stats').innerHTML = `
             <div class="bg-white p-6 rounded-xl shadow">Total Produtos: <span class="font-bold">${data.summary.total_products}</span></div>
             <div class="bg-white p-6 rounded-xl shadow">Itens Estoque: <span class="font-bold">${data.summary.total_items}</span></div>
             <div class="bg-white p-6 rounded-xl shadow text-red-600">Estoque Baixo: <span class="font-bold">${data.summary.low_stock}</span></div>
           `;
        }
      } else {
        const data = await api('/api/products');
        if (data.success) {
           state.products = data.data;
           document.getElementById('table-body').innerHTML = data.data.map(p => `
             <tr class="border-b">
               <td class="p-4 flex items-center space-x-3"><img src="${p.image || 'images/products/default.jpg'}" class="w-10 h-10 object-cover rounded">${p.name}</td>
               <td class="p-4 text-center font-bold">${p.quantity} un</td>
               <td class="p-4 font-bold text-gray-600">${p.price}</td>
               <td class="p-4"><button onclick="openModal('${p.id}')" class="text-orange-600 font-bold">Editar</button></td>
             </tr>
           `).join('');
        }
      }
    }

    function openModal(id = null) {
      const p = id ? state.products.find(x => x.id === id) : { name:'', category:'Geral', price:'', initial_stock:0, min_quantity:5, description:'' };
      const m = document.createElement('div');
      m.id = 'modal';
      m.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50';
      m.innerHTML = `
        <form onsubmit="handleSave(event, '${id||''}')" class="bg-white p-6 rounded-xl shadow-xl w-full max-w-lg space-y-4 max-h-[90vh] overflow-auto">
          <h3 class="text-xl font-bold">${id?'Editar':'Cadastrar'} Produto</h3>
          <input name="name" value="${p.name}" class="w-full p-2 border rounded" placeholder="Nome do Produto" required>
          <input name="category" value="${p.category}" class="w-full p-2 border rounded" placeholder="Categoria">
          <div class="grid grid-cols-2 gap-4">
             <input name="price" value="${p.price}" class="w-full p-2 border rounded" placeholder="Preço R$" required>
             <input type="number" name="min_quantity" value="${p.min_quantity}" class="w-full p-2 border rounded" placeholder="Estoque Mínimo">
          </div>
          ${!id ? `<input type="number" name="initial_stock" value="0" class="w-full p-2 border rounded" placeholder="Estoque Inicial">` : ''}
          <textarea name="description" class="w-full p-2 border rounded" placeholder="Descrição">${p.description||''}</textarea>
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">FOTO DO PRODUTO (Tirar Foto ou Galeria)</label>
            <input type="file" name="image" accept="image/*" capture="environment" class="w-full text-sm">
          </div>
          <div class="flex justify-end space-x-3 pt-4">
             <button type="button" onclick="this.closest('#modal').remove()" class="px-4 py-2">Cancelar</button>
             <button class="bg-orange-500 text-white px-6 py-2 rounded-lg font-bold">SALVAR</button>
          </div>
        </form>
      `;
      document.body.appendChild(m);
    }

    async function handleSave(e, id) {
      e.preventDefault();
      const loader = document.getElementById('loading');
      const loadText = document.getElementById('loading-text');
      loader.style.display = 'flex';
      
      const formData = new FormData(e.target);
      const imgFile = e.target.image.files[0];
      
      if (imgFile) {
        loadText.innerText = 'Comprimindo foto (otimizando para subir rápido)...';
        try {
          const compressed = await compressImage(imgFile);
          formData.set('image', compressed);
        } catch(err) { console.error('Compression error', err); }
      }
      
      loadText.innerText = 'Enviando para o servidor...';
      const url = id ? '/api/products/'+id : '/api/products';
      const res = await api(url, { method: id ? 'PUT' : 'POST', body: formData });
      
      loader.style.display = 'none';
      if (res.success) {
        toast('Salvo com sucesso!');
        document.getElementById('modal').remove();
        loadPageData();
      }
    }

    checkAuth();
  </script>
</body>
</html>
